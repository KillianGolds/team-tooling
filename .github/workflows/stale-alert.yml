name: Stale PR Alert

on:
  schedule:
    - cron: '0 9 * * 1'  # Monday 9am UTC — start the week with the stale list
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install '.[pr_digest]'

      - run: python -m pr_digest.stale
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
