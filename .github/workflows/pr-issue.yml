name: Upstream PR Issue Update

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6h
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout needs this; setting `permissions:` replaces the defaults
      issues: write   # built-in GITHUB_TOKEN edits the live digest issue
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install '.[pr_digest]'

      - run: python -m pr_digest.issue
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
