# Where the always-current PR digest issue lives. The Action updates this
# issue's body on a schedule, and the weekly Slack ping links to it. The
# Action's built-in GITHUB_TOKEN can write here (no Slack-app admin approval).
# Workflow: create the issue manually, paste its number here, then pin it.
issue:
  repo: KillianGolds/team-tooling
  number: 1

thresholds:
  fast_lane_max_size: 500   # additions + deletions
  fast_lane_max_files: 5    # also caps fast-lane by file count
  stale_days: 7             # days without activity before stale-alert fires

# Glob patterns for files to exclude from the line-count.
# Generated/vendored stuff inflates PR size without adding review burden.
exclude_paths:
  - "go.sum"
  - "go.mod"
  - "vendor/**"
  - "bundle/**"             # generated OLM operator bundle (manifests/CSVs/CRDs)
  - "**/*.pb.go"
  - "**/zz_generated_*.go"
  - "**/*_generated.go"
  - "**/mock_*.go"
  - "**/testdata/**"
  # remove the next line if you want docs changes to count toward size
  - "**/*.md"
