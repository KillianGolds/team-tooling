[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-tooling"
version = "0.1.0"
description = "Internal tooling for tracking upstream PRs across the team."
requires-python = ">=3.10"
# Shared runtime deps used by common/ and any tool: github_client.py uses
# requests, config.py uses PyYAML, the formatters use requests for posting.
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Per-tool extras: install only what a given tool needs.
# Today neither tool needs anything beyond the shared base: flake_digest
# reads the public GCS bucket through the anonymous JSON API with requests,
# so the planned google-cloud-storage dep turned out to be unnecessary.
pr_digest = []
flake_digest = []
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["pr_digest*", "flake_digest*", "common*"]
exclude = ["tests*"]
