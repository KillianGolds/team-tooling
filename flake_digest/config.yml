# flake_digest configuration. Same layout convention as pr_digest:
# per-tool config lives next to the package, override path via
# FLAKE_DIGEST_CONFIG.

window_days: 30
# runtime trend history outlives flake counts on purpose; keep this at
# least as long as any headroom trailing window (James may want
# release-cycle scale, pending his answer)
timings_retention_days: 56
# the headroom section's stats window; the trend doubles it, so
# timings_retention_days must stay >= 2x this
headroom_recent_days: 14

# the pinned issue the cron rewrites; evidence links point at this
# repo's reports/ directory
issue:
  repo: KillianGolds/team-tooling
  number: 2

# Midstream Prow sources. A list so a second repo (odh-model-controller,
# same bucket and layout) is a config entry, not a code change; only
# kserve is enabled for now.
midstream:
  - repo: opendatahub-io/kserve
    # branch-agnostic on purpose: branch topology is changing (release-v*
    # retirement), so any branch segment matches
    job_pattern: "^pull-ci-opendatahub-io-kserve-.*-e2e-.*$"
    # Permanent, structural: e2e-kserve-module emits no result files at
    # all (James confirmed it's a reporting oversight upstream). Job-level
    # only until that changes.
    job_level_only:
      - e2e-kserve-module
      # the TLS scanner's only per-test output is a junit whose test
      # identities are pod IPs and generated pod names, different every
      # build, so there is nothing stable to track below job level
      - e2e-tls-scanner
      # optional smoke wrapper around the module harness; listed ahead
      # of its first-ever run on the assumption it reports like
      # kserve-module does
      - e2e-kserve-module-post-release
