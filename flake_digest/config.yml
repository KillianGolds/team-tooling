# flake_digest configuration. Same layout convention as pr_digest:
# per-tool config lives next to the package, override path via
# FLAKE_DIGEST_CONFIG.

window_days: 30

# the pinned issue the cron rewrites; evidence links point at this
# repo's reports/ directory
issue:
  repo: KillianGolds/team-tooling
  number: 2

# Midstream Prow sources. A list so a second repo (odh-model-controller,
# same bucket and layout) is a config entry, not a code change; only
# kserve is enabled for now.
midstream:
  - repo: opendatahub-io/kserve
    # branch-agnostic on purpose: branch topology is changing (release-v*
    # retirement), so any branch segment matches
    job_pattern: "^pull-ci-opendatahub-io-kserve-.*-e2e-.*$"
    # Permanent, structural: e2e-kserve-module emits no result files at
    # all (James confirmed it's a reporting oversight upstream). Job-level
    # only until that changes.
    job_level_only:
      - e2e-kserve-module
    # Temporary transition artifact, NOT permanent config: e2e-raw's
    # historical bare e2e_results.json files are clobbered (two pytest
    # runs wrote the same file, only the last survived), so a bare file
    # on this target can't be trusted. Suffixed per-invocation files
    # (the post-2026-07 layout) parse normally. Deletable once no
    # pre-migration raw builds remain in the window; the cron logs when
    # this list stops matching anything as the signal it's safe to drop.
    bare_untrusted_until_migrated:
      - e2e-raw
